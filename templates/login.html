{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mani-WorldStream | Login</title>
    <link rel="stylesheet" href="{% static 'css/auth.css' %}">
    <link rel="icon" type="image/png" href="{% static 'assets/favicon.png' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Background Elements -->
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>

    <div class="auth-container glass-panel">
        <div class="auth-header">
            <i class="fas fa-compact-disc logo-icon"></i>
            <h2>Welcome Back</h2>
            <p>Enter the universe of entertainment.</p>
        </div>

        <!-- Error Messages -->
        {% if messages %}
            <div class="messages">
                {% for message in messages %}
                    <p class="error-msg"><i class="fas fa-exclamation-circle"></i> {{ message }}</p>
                {% endfor %}
            </div>
        {% endif %}

        <form method="POST" action="{% url 'login' %}" class="auth-form">
            {% csrf_token %}
            
            <div class="input-group">
                <i class="fas fa-user input-icon"></i>
                <input type="text" name="username" placeholder="Username" required>
            </div>
            
            <div class="input-group">
                <i class="fas fa-lock input-icon"></i>
                <input type="password" name="password" placeholder="Password" required>
            </div>

            <button type="submit" class="auth-btn">IGNITE <i class="fas fa-arrow-right"></i></button>
        </form>

        <div class="auth-footer">
            <p>New to Orbit? <a href="{% url 'register' %}">Create an account</a></p>
        </div>
    </div>
</body>
</html>
