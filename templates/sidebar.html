<!-- Interactive Sidebar -->
<nav class="sidebar" id="sidebar">
    <!-- The Spinning Reel Trigger -->
    <div class="sidebar-trigger" id="sidebar-trigger">
        <i class="fas fa-compact-disc spinning-reel"></i>
    </div>
    
    <!-- The Expanding Half-Circle Menu -->
    <div class="sidebar-menu" id="sidebar-menu">
        <a href="{% url 'home' %}" class="menu-item" style="top: 8%; left: 20%;" title="Home"><i class="fas fa-home"></i></a>
        <a href="{% url 'tv' %}" class="menu-item" style="top: 20%; left: 50%;" title="TV"><i class="fas fa-tv"></i></a>
        <a href="{% url 'movies' %}" class="menu-item" style="top: 35%; left: 75%;" title="Movies"><i class="fas fa-video"></i></a>
        <a href="{% url 'music' %}" class="menu-item" style="top: 50%; left: 85%;" title="Songs"><i class="fas fa-music"></i></a>
        <a href="{% url 'news' %}" class="menu-item" style="top: 65%; left: 75%;" title="News"><i class="fas fa-newspaper"></i></a>
        <a href="{% url 'sports' %}" class="menu-item" style="top: 80%; left: 50%;" title="Sports"><i class="fas fa-volleyball-ball"></i></a>
        <a href="{% url 'profile' %}" class="menu-item" style="top: 92%; left: 20%;" title="My Profile"><i class="fas fa-user"></i></a>
    </div>
</nav>

<script>
    const sidebar = document.getElementById('sidebar');
    const sidebarTrigger = document.getElementById('sidebar-trigger');

    // 1. Open/Toggle the sidebar when clicking the movie reel
    sidebarTrigger.addEventListener('click', (e) => {
        sidebar.classList.toggle('active');
        e.stopPropagation(); // Prevents the document click event from firing immediately
    });

    // 2. Close the sidebar when clicking anywhere outside of it
    document.addEventListener('click', (e) => {
        // If the sidebar is active AND the clicked target is NOT inside the sidebar
        if (sidebar && sidebar.classList.contains('active') && !sidebar.contains(e.target)) {
            sidebar.classList.remove('active');
        }
    });
</script>
